<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Font Changer</title>
<style>
  /* Figma injects --figma-color-* when the UI is shown with themeColors: true,
     so the plugin follows the editor's light or dark theme. Fallbacks are Figma's light theme. */
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg-hover: var(--figma-color-bg-hover, #f0f0f0);
    --bg-pressed: var(--figma-color-bg-pressed, #e6e6e6);
    --text: var(--figma-color-text, #1e1e1e);
    --text-2: var(--figma-color-text-secondary, rgba(0,0,0,0.6));
    --text-3: var(--figma-color-text-tertiary, rgba(0,0,0,0.4));
    --icon: var(--figma-color-icon-secondary, rgba(0,0,0,0.5));
    --border: var(--figma-color-border, #e6e6e6);
    --border-strong: var(--figma-color-border-strong, #c4c4c4);
    --focus: var(--figma-color-border-selected, #0d99ff);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-hover: var(--figma-color-bg-brand-hover, #007be5);
    --on-brand: var(--figma-color-text-onbrand, #ffffff);
    --danger: var(--figma-color-text-danger, #dc3412);
    --warning: var(--figma-color-text-warning, #b86200);
    --success: var(--figma-color-text-success, #14ae5c);
    --shadow: 0 2px 14px rgba(0,0,0,0.15), 0 0 0 0.5px rgba(0,0,0,0.2);
    --radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    line-height: 16px;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    overflow-y: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  svg { display: block; flex-shrink: 0; }

  /* ── SECTIONS ───────────────────────────────────── */
  .section { padding: 12px 16px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    height: 24px; margin-bottom: 8px;
  }
  .section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.005em; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .span-2 { grid-column: span 2; }
  .field-label { display: block; font-size: 11px; color: var(--text-2); margin-bottom: 4px; }

  /* ── INPUTS ─────────────────────────────────────── */
  .input {
    position: relative; display: flex; align-items: center;
    height: 32px; border-radius: var(--radius);
    background: var(--bg-2);
    border: 1px solid transparent;
    transition: border-color 0.1s;
  }
  .input:hover { border-color: var(--border); }
  .input:focus-within { border-color: var(--focus); background: var(--bg); }
  .input.invalid { border-color: var(--danger); }
  .input .lead { margin-left: 8px; color: var(--icon); }
  .input input, .input select {
    flex: 1; min-width: 0; height: 100%;
    background: transparent; border: none; outline: none;
    color: var(--text); font: inherit;
    padding: 0 8px;
  }
  .input input::placeholder { color: var(--text-3); }
  .input select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 26px; }
  .input select option { background: var(--bg); color: var(--text); }
  .input .trail { position: absolute; right: 8px; color: var(--icon); pointer-events: none; }
  .input .clear {
    display: none; width: 20px; height: 20px; margin-right: 6px; border: none; border-radius: 4px;
    background: transparent; color: var(--icon); cursor: pointer; align-items: center; justify-content: center;
  }
  .input .clear:hover { background: var(--bg-hover); color: var(--text); }
  .input.has-value .clear { display: flex; }
  .input.has-value .trail.chevron { display: none; }
  .hint { font-size: 11px; color: var(--danger); margin-top: 4px; display: none; }
  .invalid + .hint { display: block; }

  /* ── FONT PICKER ────────────────────────────────── */
  .combo { position: relative; }
  .popover {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    max-height: 232px; overflow-y: auto;
    background: var(--bg); border-radius: 8px; box-shadow: var(--shadow);
    padding: 4px; display: none;
  }
  .combo.open .popover { display: block; }
  .option {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 28px; padding: 0 8px; border-radius: 4px; cursor: default;
  }
  .option.active { background: var(--brand); color: var(--on-brand); }
  .option.active .option-meta { color: var(--on-brand); opacity: 0.8; }
  .option-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .option-name mark { background: none; color: inherit; font-weight: 600; }
  .option-meta { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
  .popover-empty { padding: 10px 8px; color: var(--text-3); }

  /* ── PREVIEW ────────────────────────────────────── */
  .preview {
    margin-top: 10px; padding: 10px 12px; border-radius: var(--radius);
    border: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; min-height: 56px;
  }
  .preview-glyph { font-size: 28px; line-height: 1; width: 40px; text-align: center; flex-shrink: 0; }
  .preview-text { font-size: 13px; color: var(--text-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .preview-label { font-size: 11px; color: var(--text-3); margin-bottom: 2px; font-family: "Inter", -apple-system, sans-serif; letter-spacing: 0; line-height: 16px; font-weight: 400; font-style: normal; }

  /* ── STYLE LIST ─────────────────────────────────── */
  .styles { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .styles .section-head { padding: 12px 16px 0; margin-bottom: 8px; }
  .count { color: var(--text-3); font-weight: 400; margin-left: 4px; }
  .toolbar { display: flex; gap: 8px; padding: 0 16px 8px; }
  .toolbar .input { height: 28px; }
  .toolbar .search { flex: 1; }
  .toolbar .filter { width: 140px; flex-shrink: 0; }

  .icon-btn {
    width: 24px; height: 24px; border-radius: 4px; border: none; background: transparent;
    color: var(--icon); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
  .text-btn {
    height: 24px; padding: 0 6px; border: none; border-radius: 4px; background: transparent;
    color: var(--text-2); font-size: 11px; cursor: pointer;
  }
  .text-btn:hover { background: var(--bg-hover); color: var(--text); }
  .text-btn[hidden] { display: none; }
  .icon-btn.spin svg { animation: spin 0.6s linear; }

  .select-bar {
    display: flex; align-items: center; gap: 10px;
    height: 32px; padding: 0 16px; flex-shrink: 0;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--bg-2); color: var(--text-2); font-size: 11px;
    cursor: pointer; user-select: none;
  }

  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 8px; }
  .group-head {
    display: flex; align-items: center; gap: 10px;
    height: 28px; padding: 0 16px; margin-top: 4px;
    font-size: 11px; font-weight: 600; color: var(--text-2);
    cursor: pointer; user-select: none;
  }
  .group-head .count { font-weight: 400; }
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 16px; cursor: pointer; user-select: none;
  }
  .grouped .item { padding-left: 32px; }
  .item:hover, .group-head:hover, .select-bar:hover { background: var(--bg-hover); }
  .item-glyph {
    width: 28px; height: 28px; border-radius: 4px; flex-shrink: 0;
    background: var(--bg-2); color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .item-text { flex: 1; min-width: 0; }
  .item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .badge {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px;
    height: 20px; padding: 0 6px; border-radius: 4px; font-size: 10.5px; font-weight: 500;
  }
  .badge.success { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
  .badge.warn { color: var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); }
  .badge.error { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  /* ── CHECKBOX ───────────────────────────────────── */
  .check {
    appearance: none; -webkit-appearance: none; flex-shrink: 0;
    width: 14px; height: 14px; margin: 0; border-radius: 3px;
    border: 1px solid var(--border-strong); background: var(--bg);
    display: grid; place-content: center; cursor: pointer;
  }
  .check::after {
    content: ""; width: 8px; height: 6px; display: none;
    border-left: 1.6px solid var(--on-brand); border-bottom: 1.6px solid var(--on-brand);
    transform: translateY(-1px) rotate(-45deg);
  }
  .check:checked, .check:indeterminate { background: var(--brand); border-color: var(--brand); }
  .check:checked::after { display: block; }
  .check:indeterminate::after {
    display: block; width: 8px; height: 0; border-left: none; border-bottom: 1.6px solid var(--on-brand); transform: none;
  }
  .check:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* ── EMPTY STATES ───────────────────────────────── */
  .empty { padding: 32px 24px; text-align: center; color: var(--text-3); }
  .empty-title { color: var(--text-2); font-weight: 500; margin-bottom: 4px; }

  /* ── FOOTER ─────────────────────────────────────── */
  .footer {
    flex-shrink: 0; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-top: 1px solid var(--border); background: var(--bg);
  }
  .summary { flex: 1; min-width: 0; font-size: 11px; color: var(--text-2); }
  .summary strong { color: var(--text); font-weight: 500; }
  .summary-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    flex-shrink: 0; height: 32px; padding: 0 14px; border-radius: var(--radius); border: none;
    background: var(--brand); color: var(--on-brand); font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--brand-hover); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .spinner {
    width: 12px; height: 12px; border-radius: 50%; display: none;
    border: 1.5px solid currentColor; border-right-color: transparent; animation: spin 0.7s linear infinite;
  }
  .btn.loading .spinner { display: block; }

  /* ── TOAST ──────────────────────────────────────── */
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: 68px; z-index: 30;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 12px; border-radius: 8px;
    background: #1e1e1e; color: #ffffff; box-shadow: var(--shadow);
    font-size: 11.5px; line-height: 16px;
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
  }
  .toast.show { opacity: 1; transform: none; pointer-events: auto; }
  .toast-icon { margin-top: 1px; }
  .toast.success .toast-icon { color: #14ae5c; }
  .toast.error .toast-icon { color: #f24822; }
  .toast-text { flex: 1; }
  .toast .icon-btn { width: 18px; height: 18px; color: rgba(255,255,255,0.6); margin: -1px -4px 0 0; }
  .toast .icon-btn:hover { background: rgba(255,255,255,0.1); color: #ffffff; }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <!-- ── CHANGES ──────────────────────────────────── -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">Changes</div>
      <button class="text-btn" id="reset" title="Clear all fields" hidden>Reset</button>
    </div>

    <div class="grid">
      <div class="span-2">
        <label class="field-label" for="family">Font family</label>
        <div class="combo" id="combo">
          <div class="input" id="family-box">
            <svg class="lead" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3.5-10h1L11 13M4.4 9.5h5.2"/><path d="M12 6.5v6.5"/></svg>
            <input type="text" id="family" placeholder="Keep current font" autocomplete="off" spellcheck="false"
                   role="combobox" aria-expanded="false" aria-controls="font-options" aria-autocomplete="list" />
            <button class="clear" id="family-clear" tabindex="-1" title="Clear">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
            </button>
            <svg class="trail chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg>
          </div>
          <div class="hint">Font not found. Pick one from the list.</div>
          <div class="popover" id="font-options" role="listbox"></div>
        </div>
      </div>

      <div class="span-2">
        <label class="field-label" for="weight">Weight</label>
        <div class="input">
          <select id="weight" disabled>
            <option value="">Keep each style's weight</option>
          </select>
          <svg class="trail" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg>
        </div>
      </div>

      <div>
        <label class="field-label" for="line-height">Line height</label>
        <div class="input" id="line-height-box" title="Pixels (24), percent (150%) or auto">
          <svg class="lead" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5h11M2.5 13.5h11"/><path d="M5.5 11l2-6h1l2 6M6.2 9h3.6"/></svg>
          <input type="text" id="line-height" placeholder="Keep" autocomplete="off" spellcheck="false" />
        </div>
        <div class="hint">Use 24, 24px, 150% or auto.</div>
      </div>

      <div>
        <label class="field-label" for="letter-spacing">Letter spacing</label>
        <div class="input" id="letter-spacing-box" title="Percent (-2%) or pixels (0.5px)">
          <svg class="lead" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5v11M13.5 2.5v11"/><path d="M5.5 11l2-6h1l2 6M6.2 9h3.6"/></svg>
          <input type="text" id="letter-spacing" placeholder="Keep" autocomplete="off" spellcheck="false" />
        </div>
        <div class="hint">Use -2, -2% or 0.5px.</div>
      </div>
    </div>

    <div class="preview" id="preview" title="Preview uses fonts installed on this computer">
      <div class="preview-glyph" id="preview-glyph">Ag</div>
      <div style="min-width: 0;">
        <div class="preview-label" id="preview-label">Preview</div>
        <div class="preview-text" id="preview-text">The quick brown fox jumps over the lazy dog</div>
      </div>
    </div>
  </div>

  <!-- ── TEXT STYLES ──────────────────────────────── -->
  <div class="styles">
    <div class="section-head">
      <div class="section-title">Text styles<span class="count" id="style-count"></span></div>
      <button class="icon-btn" id="refresh" title="Reload text styles">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.55"/><path d="M13 2.5v2.5h-2.5"/></svg>
      </button>
    </div>

    <div class="toolbar">
      <div class="input search">
        <svg class="lead" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="6" cy="6" r="4"/><path d="M9 9l3 3"/></svg>
        <input type="text" id="search" placeholder="Search styles" autocomplete="off" spellcheck="false" />
      </div>
      <div class="input filter">
        <select id="filter" title="Show styles that use this font">
          <option value="">All fonts</option>
        </select>
        <svg class="trail" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg>
      </div>
    </div>

    <label class="select-bar" id="select-bar">
      <input type="checkbox" class="check" id="select-all" />
      <span id="select-label">Select all</span>
    </label>

    <div class="list" id="list">
      <div class="empty">Loading text styles…</div>
    </div>
  </div>

  <!-- ── FOOTER ───────────────────────────────────── -->
  <div class="footer">
    <div class="summary" id="summary"></div>
    <button class="btn" id="apply" disabled>
      <span class="spinner"></span>
      <span id="apply-label">Update styles</span>
    </button>
  </div>

  <div class="toast" id="toast" role="status">
    <svg class="toast-icon" id="toast-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></svg>
    <div class="toast-text" id="toast-text"></div>
    <button class="icon-btn" id="toast-close" title="Dismiss">
      <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
    </button>
  </div>

<script>
  var families = [];
  var familyByLower = {};
  var stylesByFamily = {};
  var textStyles = [];
  var selected = {};
  var notes = {};
  var applying = false;

  var familyInput = document.getElementById("family");
  var familyBox = document.getElementById("family-box");
  var familyClear = document.getElementById("family-clear");
  var combo = document.getElementById("combo");
  var fontOptions = document.getElementById("font-options");
  var weightSelect = document.getElementById("weight");
  var lineHeightInput = document.getElementById("line-height");
  var lineHeightBox = document.getElementById("line-height-box");
  var letterSpacingInput = document.getElementById("letter-spacing");
  var letterSpacingBox = document.getElementById("letter-spacing-box");
  var previewGlyph = document.getElementById("preview-glyph");
  var previewText = document.getElementById("preview-text");
  var previewLabel = document.getElementById("preview-label");
  var searchInput = document.getElementById("search");
  var filterSelect = document.getElementById("filter");
  var selectAll = document.getElementById("select-all");
  var selectLabel = document.getElementById("select-label");
  var styleCount = document.getElementById("style-count");
  var listEl = document.getElementById("list");
  var summaryEl = document.getElementById("summary");
  var applyBtn = document.getElementById("apply");
  var applyLabel = document.getElementById("apply-label");
  var toast = document.getElementById("toast");
  var toastIcon = document.getElementById("toast-icon");
  var toastText = document.getElementById("toast-text");

  function post(msg) { parent.postMessage({ pluginMessage: msg }, "*"); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  // ── Toast ────────────────────────────────────────

  var toastTimer = null;
  var TOAST_ICONS = {
    success: '<circle cx="7" cy="7" r="5.8"/><path d="M4.6 7.1l1.7 1.7 3.1-3.3"/>',
    error: '<circle cx="7" cy="7" r="5.8"/><path d="M7 4.2v3.4M7 9.7v.1"/>',
  };

  function showToast(text, kind) {
    clearTimeout(toastTimer);
    toast.className = "toast show " + kind;
    toastIcon.innerHTML = TOAST_ICONS[kind];
    toastText.textContent = text;
    if (kind === "success") toastTimer = setTimeout(hideToast, 4000);
  }

  function hideToast() { toast.classList.remove("show"); }

  document.getElementById("toast-close").addEventListener("click", hideToast);

  // ── Parsing ──────────────────────────────────────

  function targetFamily() {
    return familyByLower[familyInput.value.trim().toLowerCase()] || null;
  }

  // "" → keep, "auto" → AUTO, "150%" → PERCENT, "24" or "24px" → PIXELS. Returns undefined if invalid.
  function parseLineHeight(raw) {
    var s = raw.trim().toLowerCase();
    if (!s) return null;
    if (s === "auto") return { unit: "AUTO" };
    var m = s.match(/^(\d*\.?\d+)\s*(px|%)?$/);
    if (!m) return undefined;
    return { value: parseFloat(m[1]), unit: m[2] === "%" ? "PERCENT" : "PIXELS" };
  }

  // "" → keep, "0.5px" → PIXELS, "-2" or "-2%" → PERCENT (Figma's default unit). Returns undefined if invalid.
  function parseLetterSpacing(raw) {
    var s = raw.trim().toLowerCase();
    if (!s) return null;
    var m = s.match(/^(-?\d*\.?\d+)\s*(px|%)?$/);
    if (!m) return undefined;
    return { value: parseFloat(m[1]), unit: m[2] === "px" ? "PIXELS" : "PERCENT" };
  }

  function formatLineHeight(lh) {
    if (lh.unit === "AUTO") return "Auto";
    return lh.value + (lh.unit === "PERCENT" ? "%" : "px");
  }

  function formatLetterSpacing(ls) {
    return ls.value + (ls.unit === "PERCENT" ? "%" : "px");
  }

  // Returns the changes requested in the form, or null if a field is invalid.
  function pendingChanges() {
    var family = targetFamily();
    var familyInvalid = !!familyInput.value.trim() && !family && !combo.classList.contains("open");
    var lineHeight = parseLineHeight(lineHeightInput.value);
    var letterSpacing = parseLetterSpacing(letterSpacingInput.value);
    familyBox.classList.toggle("invalid", familyInvalid);
    lineHeightBox.classList.toggle("invalid", lineHeight === undefined);
    letterSpacingBox.classList.toggle("invalid", letterSpacing === undefined);
    if ((familyInput.value.trim() && !family) || lineHeight === undefined || letterSpacing === undefined) return null;
    return {
      family: family,
      style: family ? weightSelect.value : "",
      lineHeight: lineHeight,
      letterSpacing: letterSpacing,
    };
  }

  // ── Font picker ──────────────────────────────────

  var matches = [];
  var activeIndex = -1;
  var MAX_OPTIONS = 150;

  function openFonts() {
    combo.classList.add("open");
    familyInput.setAttribute("aria-expanded", "true");
    renderFontOptions();
  }

  function closeFonts() {
    combo.classList.remove("open");
    familyInput.setAttribute("aria-expanded", "false");
    activeIndex = -1;
  }

  function renderFontOptions() {
    var q = familyInput.value.trim().toLowerCase();
    if (!q) {
      matches = families.slice(0, MAX_OPTIONS);
    } else {
      var starts = [];
      var contains = [];
      for (var i = 0; i < families.length; i++) {
        var idx = families[i].toLowerCase().indexOf(q);
        if (idx === 0) starts.push(families[i]);
        else if (idx > 0) contains.push(families[i]);
      }
      matches = starts.concat(contains).slice(0, MAX_OPTIONS);
    }
    if (activeIndex >= matches.length) activeIndex = matches.length - 1;
    if (activeIndex < 0 && q && matches.length) activeIndex = 0;

    if (!families.length) {
      fontOptions.innerHTML = '<div class="popover-empty">Loading fonts…</div>';
      return;
    }
    if (!matches.length) {
      fontOptions.innerHTML = '<div class="popover-empty">No fonts match “' + escapeHtml(familyInput.value.trim()) + '”</div>';
      return;
    }

    fontOptions.innerHTML = matches.map(function (f, i) {
      var name = escapeHtml(f);
      var at = q ? f.toLowerCase().indexOf(q) : -1;
      if (at !== -1) {
        name = escapeHtml(f.slice(0, at)) + "<mark>" + escapeHtml(f.slice(at, at + q.length)) + "</mark>" + escapeHtml(f.slice(at + q.length));
      }
      var n = stylesByFamily[f].length;
      return '<div class="option' + (i === activeIndex ? " active" : "") + '" role="option" data-index="' + i + '">' +
        '<span class="option-name">' + name + "</span>" +
        '<span class="option-meta">' + plural(n, "style") + "</span>" +
      "</div>";
    }).join("");
    scrollActiveIntoView();
  }

  function scrollActiveIntoView() {
    var el = fontOptions.querySelector(".option.active");
    if (el) el.scrollIntoView({ block: "nearest" });
  }

  function setActive(index) {
    activeIndex = index;
    var options = fontOptions.querySelectorAll(".option");
    for (var i = 0; i < options.length; i++) options[i].classList.toggle("active", i === index);
    scrollActiveIntoView();
  }

  function chooseFamily(family) {
    familyInput.value = family;
    closeFonts();
    onFamilyChanged();
  }

  function onFamilyChanged() {
    familyBox.classList.toggle("has-value", !!familyInput.value);
    renderWeights();
    renderPreview();
    updateControls();
  }

  familyInput.addEventListener("focus", function () {
    familyInput.select();
    openFonts();
  });

  familyInput.addEventListener("input", function () {
    activeIndex = -1;
    openFonts();
    onFamilyChanged();
  });

  familyInput.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!combo.classList.contains("open")) { openFonts(); return; }
      if (!matches.length) return;
      var next = activeIndex + (e.key === "ArrowDown" ? 1 : -1);
      setActive(Math.max(0, Math.min(matches.length - 1, next)));
    } else if (e.key === "Enter") {
      if (combo.classList.contains("open") && activeIndex >= 0 && matches[activeIndex]) {
        e.preventDefault();
        chooseFamily(matches[activeIndex]);
      }
    } else if (e.key === "Escape") {
      if (combo.classList.contains("open")) {
        e.stopPropagation();
        closeFonts();
        updateControls();
      }
    }
  });

  familyInput.addEventListener("blur", function () {
    var exact = targetFamily();
    if (exact) familyInput.value = exact;
    closeFonts();
    onFamilyChanged();
  });

  // mousedown keeps focus in the input so blur does not close the list before the click lands.
  fontOptions.addEventListener("mousedown", function (e) { e.preventDefault(); });
  fontOptions.addEventListener("click", function (e) {
    var option = e.target.closest(".option");
    if (option) chooseFamily(matches[Number(option.getAttribute("data-index"))]);
  });
  fontOptions.addEventListener("mousemove", function (e) {
    var option = e.target.closest(".option");
    if (option) {
      var i = Number(option.getAttribute("data-index"));
      if (i !== activeIndex) setActive(i);
    }
  });

  familyClear.addEventListener("mousedown", function (e) { e.preventDefault(); });
  familyClear.addEventListener("click", function () {
    familyInput.value = "";
    onFamilyChanged();
  });

  // ── Weight & preview ─────────────────────────────

  var WEIGHT_KEYWORDS = [
    ["extrablack", 950], ["ultrablack", 950], ["black", 900], ["heavy", 900],
    ["extrabold", 800], ["ultrabold", 800], ["semibold", 600], ["demibold", 600], ["demi", 600],
    ["bold", 700], ["medium", 500], ["regular", 400], ["normal", 400], ["book", 400], ["roman", 400],
    ["extralight", 200], ["ultralight", 200], ["light", 300], ["thin", 100], ["hairline", 100],
  ];

  function cssWeight(style) {
    var s = String(style || "").toLowerCase().replace(/[\s_-]/g, "");
    for (var i = 0; i < WEIGHT_KEYWORDS.length; i++) {
      if (s.indexOf(WEIGHT_KEYWORDS[i][0]) !== -1) return Math.min(900, WEIGHT_KEYWORDS[i][1]);
    }
    return 400;
  }

  function renderWeights() {
    var family = targetFamily();
    var current = weightSelect.value;
    var styles = family ? stylesByFamily[family].slice().sort(function (a, b) {
      return cssWeight(a) - cssWeight(b) || (/italic|oblique/i.test(a) ? 1 : 0) - (/italic|oblique/i.test(b) ? 1 : 0);
    }) : [];
    weightSelect.innerHTML = '<option value="">Keep each style\'s weight</option>' + styles.map(function (st) {
      return '<option value="' + escapeHtml(st) + '">' + escapeHtml(st) + "</option>";
    }).join("");
    weightSelect.value = styles.indexOf(current) !== -1 ? current : "";
    weightSelect.disabled = !family;
  }

  function renderPreview() {
    var family = targetFamily();
    var weight = weightSelect.value;
    var lh = parseLineHeight(lineHeightInput.value);
    var ls = parseLetterSpacing(letterSpacingInput.value);

    var fontFamily = family ? '"' + family.replace(/"/g, "") + '", "Inter", sans-serif' : "";
    [previewGlyph, previewText].forEach(function (el) {
      el.style.fontFamily = fontFamily;
      el.style.fontWeight = weight ? cssWeight(weight) : "";
      el.style.fontStyle = weight && /italic|oblique/i.test(weight) ? "italic" : "";
    });
    previewText.style.letterSpacing = ls ? (ls.unit === "PIXELS" ? ls.value + "px" : ls.value / 100 + "em") : "";
    previewText.style.lineHeight = lh ? (lh.unit === "AUTO" ? "normal" : lh.unit === "PERCENT" ? lh.value / 100 : lh.value + "px") : "";

    previewLabel.textContent = family ? family + (weight ? " " + weight : "") : "Preview";
  }

  weightSelect.addEventListener("change", function () {
    renderPreview();
    updateControls();
  });

  [lineHeightInput, letterSpacingInput].forEach(function (input) {
    input.addEventListener("input", function () {
      renderPreview();
      updateControls();
    });
  });

  document.getElementById("reset").addEventListener("click", function () {
    familyInput.value = "";
    lineHeightInput.value = "";
    letterSpacingInput.value = "";
    onFamilyChanged();
  });

  // ── Style list ───────────────────────────────────

  function splitName(name) {
    var at = name.lastIndexOf("/");
    return at === -1 ? { group: "", label: name } : { group: name.slice(0, at), label: name.slice(at + 1) };
  }

  function visibleStyles() {
    var filter = filterSelect.value;
    var q = searchInput.value.trim().toLowerCase();
    return textStyles.filter(function (s) {
      return (!filter || s.family === filter) && (!q || s.name.toLowerCase().indexOf(q) !== -1);
    });
  }

  function selectedIds() {
    return textStyles.filter(function (s) { return selected[s.id]; }).map(function (s) { return s.id; });
  }

  function setCheck(input, ids) {
    var on = ids.filter(function (id) { return selected[id]; }).length;
    input.checked = ids.length > 0 && on === ids.length;
    input.indeterminate = on > 0 && on < ids.length;
  }

  function renderFilter() {
    var current = filterSelect.value;
    var used = [];
    textStyles.forEach(function (s) { if (used.indexOf(s.family) === -1) used.push(s.family); });
    used.sort();
    filterSelect.innerHTML = '<option value="">All fonts</option>' + used.map(function (f) {
      return '<option value="' + escapeHtml(f) + '">' + escapeHtml(f) + "</option>";
    }).join("");
    filterSelect.value = used.indexOf(current) !== -1 ? current : "";
  }

  function badgeHtml(note) {
    if (!note) return "";
    return '<span class="badge ' + note.kind + '" title="' + escapeHtml(note.title || "") + '">' + escapeHtml(note.text) + "</span>";
  }

  function itemHtml(s, label) {
    var meta = s.family + " " + s.style + " · " + s.size + "/" + s.lineHeight + " · " + s.letterSpacing;
    return '<label class="item" title="' + escapeHtml(s.name) + '">' +
      '<input type="checkbox" class="check" data-id="' + escapeHtml(s.id) + '"' + (selected[s.id] ? " checked" : "") + " />" +
      '<div class="item-glyph" style="font-family: &quot;' + escapeHtml(s.family.replace(/"/g, "")) + '&quot;, Inter, sans-serif; font-weight: ' + cssWeight(s.style) + ';">Ag</div>' +
      '<div class="item-text">' +
        '<div class="item-name">' + escapeHtml(label) + "</div>" +
        '<div class="item-meta">' + escapeHtml(meta) + "</div>" +
      "</div>" +
      badgeHtml(notes[s.id]) +
    "</label>";
  }

  function renderList() {
    styleCount.textContent = textStyles.length ? String(textStyles.length) : "";

    if (!textStyles.length) {
      listEl.innerHTML =
        '<div class="empty"><div class="empty-title">No local text styles</div>' +
        "Create text styles in the Design panel. They will appear here automatically.</div>";
      updateControls();
      return;
    }

    var visible = visibleStyles();
    if (!visible.length) {
      listEl.innerHTML = '<div class="empty"><div class="empty-title">No matching styles</div>Try a different search or font filter.</div>';
      updateControls();
      return;
    }

    var groups = [];
    var byGroup = {};
    visible.forEach(function (s) {
      var parts = splitName(s.name);
      if (!byGroup[parts.group]) { byGroup[parts.group] = []; groups.push(parts.group); }
      byGroup[parts.group].push({ style: s, label: parts.label });
    });

    var html = "";
    groups.forEach(function (g) {
      var entries = byGroup[g];
      if (!g) {
        html += entries.map(function (e) { return itemHtml(e.style, e.label); }).join("");
        return;
      }
      html += '<label class="group-head">' +
        '<input type="checkbox" class="check" data-group="' + escapeHtml(g) + '" />' +
        "<span>" + escapeHtml(g) + '<span class="count">' + entries.length + "</span></span>" +
      "</label>" +
      '<div class="grouped">' + entries.map(function (e) { return itemHtml(e.style, e.label); }).join("") + "</div>";
    });
    listEl.innerHTML = html;

    var groupChecks = listEl.querySelectorAll("[data-group]");
    for (var i = 0; i < groupChecks.length; i++) {
      var g = groupChecks[i].getAttribute("data-group");
      setCheck(groupChecks[i], byGroup[g].map(function (e) { return e.style.id; }));
    }
    updateControls();
  }

  function groupIds(group) {
    return visibleStyles().filter(function (s) { return splitName(s.name).group === group; }).map(function (s) { return s.id; });
  }

  listEl.addEventListener("change", function (e) {
    var id = e.target.getAttribute("data-id");
    var group = e.target.getAttribute("data-group");
    if (id) {
      selected[id] = e.target.checked;
      var parent = e.target.closest(".grouped");
      if (parent) {
        var head = parent.previousElementSibling.querySelector("[data-group]");
        setCheck(head, groupIds(head.getAttribute("data-group")));
      }
      updateControls();
    } else if (group !== null) {
      groupIds(group).forEach(function (gid) { selected[gid] = e.target.checked; });
      renderList();
    }
  });

  selectAll.addEventListener("change", function () {
    visibleStyles().forEach(function (s) { selected[s.id] = selectAll.checked; });
    renderList();
  });

  searchInput.addEventListener("input", renderList);
  filterSelect.addEventListener("change", renderList);

  var refreshBtn = document.getElementById("refresh");
  refreshBtn.addEventListener("click", function () {
    refreshBtn.classList.remove("spin");
    void refreshBtn.offsetWidth;
    refreshBtn.classList.add("spin");
    post({ type: "refresh" });
  });

  // ── Footer ───────────────────────────────────────

  function renderSummary(changes) {
    if (!changes) {
      var message = familyInput.value.trim() && !targetFamily() ? "Pick a font from the list." : "Fix the highlighted field to continue.";
      var color = combo.classList.contains("open") ? "var(--text-2)" : "var(--danger)";
      summaryEl.innerHTML = '<div class="summary-line" style="color: ' + color + ';">' + message + "</div>";
      return;
    }
    var parts = [];
    if (changes.family) parts.push("<strong>" + escapeHtml(changes.family + (changes.style ? " " + changes.style : "")) + "</strong>");
    if (changes.lineHeight) parts.push("LH <strong>" + escapeHtml(formatLineHeight(changes.lineHeight)) + "</strong>");
    if (changes.letterSpacing) parts.push("LS <strong>" + escapeHtml(formatLetterSpacing(changes.letterSpacing)) + "</strong>");
    var count = selectedIds().length;
    summaryEl.innerHTML =
      '<div class="summary-line">' + (parts.length ? parts.join(" · ") : "No changes set") + "</div>" +
      '<div class="summary-line" style="color: var(--text-3);">' + (count ? plural(count, "style") + " selected" : "No styles selected") + "</div>";
  }

  function updateControls() {
    var changes = pendingChanges();
    var count = selectedIds().length;
    document.getElementById("reset").hidden = !(familyInput.value || lineHeightInput.value || letterSpacingInput.value);
    var hasChange = !!changes && !!(changes.family || changes.lineHeight || changes.letterSpacing);
    applyBtn.disabled = applying || !hasChange || !count;
    applyLabel.textContent = applying ? "Updating…" : count ? "Update " + plural(count, "style") : "Update styles";
    renderSummary(changes);

    var visible = visibleStyles();
    setCheck(selectAll, visible.map(function (s) { return s.id; }));
    selectAll.disabled = !visible.length;
    var visibleOn = visible.filter(function (s) { return selected[s.id]; }).length;
    selectLabel.textContent = visibleOn
      ? visibleOn + " of " + visible.length + " selected"
      : "Select all" + (visible.length !== textStyles.length ? " " + visible.length + " shown" : "");
  }

  function apply() {
    var changes = pendingChanges();
    var ids = selectedIds();
    if (applying || !changes || !ids.length || !(changes.family || changes.lineHeight || changes.letterSpacing)) return;
    applying = true;
    applyBtn.classList.add("loading");
    hideToast();
    updateControls();
    post({ type: "apply", styleIds: ids, options: changes });
  }

  function finishApply() {
    applying = false;
    applyBtn.classList.remove("loading");
    updateControls();
  }

  applyBtn.addEventListener("click", apply);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) apply();
  });

  // ── Messages ─────────────────────────────────────

  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;

    switch (msg.type) {
      case "fonts-list":
        families = msg.families;
        stylesByFamily = msg.stylesByFamily;
        familyByLower = {};
        families.forEach(function (f) { familyByLower[f.toLowerCase()] = f; });
        familyInput.placeholder = "Keep current font · " + families.length + " available";
        if (combo.classList.contains("open")) renderFontOptions();
        onFamilyChanged();
        break;

      case "text-styles": {
        textStyles = msg.styles;
        var ids = {};
        textStyles.forEach(function (s) { ids[s.id] = true; });
        Object.keys(selected).forEach(function (id) { if (!ids[id]) delete selected[id]; });
        Object.keys(notes).forEach(function (id) { if (!ids[id]) delete notes[id]; });
        renderFilter();
        renderList();
        break;
      }

      case "apply-complete": {
        notes = {};
        var fallbacks = 0;
        var failed = 0;
        msg.results.forEach(function (r) {
          if (!r.ok) {
            failed++;
            notes[r.id] = { kind: "error", text: "Failed", title: r.error };
          } else if (r.fallback) {
            fallbacks++;
            notes[r.id] = { kind: "warn", text: "→ " + r.to, title: "No \"" + r.from + "\" in this font. Used \"" + r.to + "\"." };
          } else {
            notes[r.id] = { kind: "success", text: "Updated" };
          }
        });
        var text = "Updated " + plural(msg.updated, "style") + ".";
        if (fallbacks) text += " " + fallbacks + " used the nearest weight.";
        if (failed) text += " " + failed + " failed. Hover the badge for details.";
        showToast(text, failed ? "error" : "success");
        finishApply();
        renderList();
        break;
      }

      case "apply-error":
        showToast(msg.error, "error");
        finishApply();
        break;
    }
  };

  updateControls();
  post({ type: "init" });
</script>
</body>
</html>
