<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CardGlow</title>
<style>
  html, body, #root { height: 100%; }
  :root {
    --bg-main: #18181A;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.07);
    --input-bg: rgba(255,255,255,0.06);
    --text-primary: #FFFFFF;
    --text-secondary: #9A9A9A;
    --text-tertiary: #60605E;
    --accent: #5B9BFF;
    --danger: #F2787A;
    --ok: #4DE6AA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }

  .app { height: 100%; display: flex; flex-direction: column; }

  /* ── TWO COLUMNS ────────────────────────────────── */
  .app.wide { flex-direction: row; }
  .left {
    width: 440px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0;
    padding: 0 20px 16px; border-right: 1px solid var(--card-border);
    background: linear-gradient(180deg, rgba(255,255,255,.015), transparent 40%);
  }
  .left .header { padding: 16px 0 12px; }
  .right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .right .main { padding-top: 16px; }
  .right .moods { margin-top: 12px; }
  .preview-box.big { position: relative; flex: 0 0 360px; height: 360px; }
  .arrow.overlay {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
    background: rgba(24,24,26,.72); backdrop-filter: blur(6px); border-color: rgba(255,255,255,.12);
  }
  .arrow.overlay:active { transform: translateY(-50%) scale(.94); }
  .arrow.overlay.prev { left: 12px; }
  .arrow.overlay.next { right: 12px; }
  .size-tag {
    position: absolute; left: 12px; bottom: 10px; font-size: 10px; color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
  }
  .left .style-meta { margin: 12px 2px 0; }
  .left .style-meta .name { font-size: 14px; }
  .left .progress { margin: 8px 2px 0; }
  .left .strip {
    flex-wrap: wrap; overflow-x: visible; overflow-y: auto; min-height: 0;
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 12px; padding: 2px;
  }
  .left .mini { width: 100%; height: auto; aspect-ratio: 1; flex: none; }

  /* ── HEADER ─────────────────────────────────────── */
  .header { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
  .logo { flex-shrink: 0; display: block; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .title { font-size: 14px; font-weight: 600; line-height: 1.2; }
  .sub { margin-top: 2px; font-size: 11px; color: var(--text-secondary); }

  .main { flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 12px; display: flex; flex-direction: column; }
  .main > * { flex-shrink: 0; }
  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }

  /* ── MOODS ──────────────────────────────────────── */
  .moods { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  .chip {
    border: 1px solid var(--card-border); background: var(--card-bg); cursor: pointer;
    border-radius: 999px; padding: 4px 10px; font-size: 10.5px; color: var(--text-secondary);
  }
  .chip:hover { border-color: rgba(255,255,255,.2); color: var(--text-primary); }
  .chip.active { border-color: var(--accent); background: rgba(91,155,255,.14); color: var(--text-primary); }

  /* ── STRIP ──────────────────────────────────────── */
  .strip { display: flex; gap: 6px; margin-top: 12px; padding-bottom: 6px; overflow-x: auto; scroll-snap-type: x proximity; flex-shrink: 0; }
  .strip::-webkit-scrollbar { height: 4px; }
  .strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }
  .mini {
    flex: 0 0 42px; height: 42px; padding: 2px; border-radius: 10px; cursor: pointer; scroll-snap-align: start;
    border: 1.5px solid transparent; background: rgba(255,255,255,.03);
    display: flex; align-items: center; justify-content: center;
  }
  .mini:hover { border-color: rgba(255,255,255,.25); }
  .mini.active { border-color: var(--accent); }

  /* ── COLOURS ────────────────────────────────────── */
  .colors { position: relative; margin-top: 10px; padding: 10px 12px; }
  .colors .adjust-head em { font-style: normal; font-weight: 500; color: var(--text-tertiary); margin-left: 4px; }
  .slot-group + .slot-group { margin-top: 8px; }
  .slot-group-name { font-size: 9.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 5px; }
  .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  .slot { position: relative; min-width: 0; }
  .slot-btn {
    width: 100%; display: flex; align-items: center; gap: 7px; min-width: 0;
    padding: 5px 7px; border-radius: 8px; cursor: pointer; text-align: left;
    border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-secondary); font-size: 10.5px;
  }
  .slot-btn:hover { border-color: rgba(255,255,255,.2); color: var(--text-primary); }
  .slot.open .slot-btn { border-color: var(--accent); color: var(--text-primary); }
  .slot.edited .slot-btn { color: var(--text-primary); padding-right: 22px; }
  .slot-btn i { width: 16px; height: 16px; flex-shrink: 0; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .slot-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot.edited .slot-label::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 5px; border-radius: 50%; background: var(--accent); vertical-align: middle; }
  .slot-reset {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; border: none; border-radius: 4px; background: none; cursor: pointer;
    color: var(--text-tertiary); font-size: 13px; line-height: 1;
  }
  .slot-reset:hover { color: var(--danger); background: rgba(242,120,122,.1); }
  .picker.inline {
    position: relative; top: auto; left: auto; right: auto; z-index: 1;
    grid-column: 1 / -1; margin: 2px 0 4px; padding: 10px;
  }
  .picker-title { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; font-size: 11.5px; font-weight: 600; }
  .picker-title i { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  .palette { margin-bottom: 9px; }
  .palette-name { font-size: 9.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 5px; }
  .palette-dots { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
  .palette-dot {
    aspect-ratio: 1; width: 100%; border: none; border-radius: 6px; cursor: pointer; padding: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    transition: transform .08s;
  }
  .palette-dot:hover { transform: scale(1.12); }
  .palette-dot.active { box-shadow: 0 0 0 2px #222225, 0 0 0 3.5px #fff; }

  /* ── ADJUST ─────────────────────────────────────── */
  .adjust { margin-top: 10px; padding: 10px 12px; }
  .adjust-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11.5px; font-weight: 600; }
  .adjust .row + .row { margin-top: 8px; }
  .adjust label { width: 56px; flex-shrink: 0; font-size: 11px; color: var(--text-secondary); }
  .link { border: none; background: none; color: var(--accent); font-size: 11px; cursor: pointer; }
  input[type="range"] {
    flex: 1; min-width: 0; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .val { width: 36px; flex-shrink: 0; text-align: right; font-size: 10.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .toggles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .toggle .check {
    width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; font-size: 9px; line-height: 12px; text-align: center;
    border: 1px solid rgba(255,255,255,.25); color: #06142E;
  }
  .toggle.on .check { background: var(--accent); border-color: var(--accent); }
  .toggle {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    border: 1px solid var(--card-border); background: var(--card-bg); border-radius: 8px;
    padding: 6px 4px; font-size: 10.5px; color: var(--text-secondary); cursor: pointer;
  }
  .toggle:hover { border-color: rgba(255,255,255,.2); color: var(--text-primary); }
  .toggle.on { border-color: var(--accent); background: rgba(91,155,255,.14); color: var(--text-primary); }
  .meta-right { display: flex; align-items: center; gap: 8px; }
  .dice {
    width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-secondary); cursor: pointer;
  }
  .dice:hover { border-color: var(--accent); color: var(--text-primary); }
  .dice:active { transform: rotate(-12deg) scale(.94); }

  /* ── COLOUR ─────────────────────────────────────── */
  .card { padding: 12px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card-bg); }
  .row { display: flex; align-items: center; gap: 8px; }
  .color-card { position: relative; }
  .swatch-btn {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; border: none; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 2px 10px rgba(0,0,0,.35);
    transition: transform .1s, box-shadow .15s;
  }
  .swatch-btn:hover { transform: scale(1.04); }
  .swatch-btn.open { box-shadow: 0 0 0 2px var(--bg-main), 0 0 0 3.5px var(--accent); }
  .color-meta { flex: 1; min-width: 0; }
  .color-meta .label { font-size: 10.5px; color: var(--text-secondary); margin-bottom: 3px; }
  .hex-field {
    display: inline-flex; align-items: center; gap: 2px; width: 100px;
    background: var(--input-bg); border: 1px solid transparent; border-radius: 7px; padding: 4px 7px;
  }
  .hex-field:focus-within { border-color: var(--accent); }
  .hex-field span { color: var(--text-tertiary); font-size: 13px; font-weight: 600; }
  .hex-field input {
    width: 100%; min-width: 0; border: none; background: none; outline: none;
    color: var(--text-primary); font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .4px;
    text-transform: uppercase; user-select: text;
  }

  /* ── PICKER POPOVER ─────────────────────────────── */
  .picker {
    position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 6px);
    padding: 12px; border-radius: 14px;
    background: #222225; border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 12px 32px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.3);
    animation: pop .12s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
  .picker.inline .sv { height: 110px; }
  .sv { position: relative; height: 136px; border-radius: 10px; cursor: crosshair; touch-action: none; }
  .sv-white, .sv-black { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
  .sv-white { background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .sv-black { background: linear-gradient(to top, #000, rgba(0,0,0,0)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .hue {
    position: relative; height: 12px; margin: 12px 6px 0; border-radius: 6px; cursor: pointer; touch-action: none;
    background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
  }
  .knob {
    position: absolute; width: 16px; height: 16px; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    border: 2.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.4);
  }
  .knob.small { top: 50%; width: 16px; height: 16px; }
  .picker-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .picker-row .hex-field { flex: 1; width: auto; }
  .picker-preview { width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .use-sel { display: flex; align-items: center; gap: 6px; }
  .use-sel i { width: 12px; height: 12px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  .swatches { display: flex; justify-content: space-between; margin-top: 12px; }
  .dot {
    width: 24px; height: 24px; border-radius: 50%; border: none; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .dot.active { box-shadow: 0 0 0 2px var(--bg-main), 0 0 0 3.5px #fff; }

  /* ── STAGE (preview + arrows) ───────────────────── */
  .stage { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-shrink: 0; }
  .preview-box { flex: 1; min-width: 0; display: flex; justify-content: center; }
  .preview-box {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
    border-radius: 14px; background: radial-gradient(circle at 50% 40%, #232326, #161618 75%);
    border: 1px solid var(--card-border);
  }
  .card-view { position: relative; overflow: hidden; isolation: isolate; flex-shrink: 0; }
  .card-view .glow { position: absolute; border-radius: 50%; pointer-events: none; }
  .card-border { position: absolute; inset: 0; pointer-events: none; z-index: 3; }

  /* Sample content, drawn at the card's scale */
  .sample {
    position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; pointer-events: none;
  }
  .sample-icon {
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.2); border: solid rgba(255,255,255,.45);
  }
  .sample-icon i { display: block; background: #fff; }
  .sample-title { font-weight: 700; line-height: 1.2; white-space: nowrap; }
  .sample-body { width: 100%; text-align: center; font-weight: 400; line-height: 1.4; opacity: .85; }
  .sample-steps { display: flex; flex-direction: column; width: 100%; }
  .sample-pill {
    display: flex; align-items: center; box-sizing: border-box;
    background: rgba(255,255,255,.18); border: solid rgba(255,255,255,.4); white-space: nowrap;
  }
  .sample-pill .badge { flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fff; font-weight: 700; }
  .arrow {
    width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-primary);
  }
  .arrow:hover { border-color: var(--accent); background: rgba(91,155,255,.12); }
  .arrow:active { transform: scale(.94); }
  .style-meta { display: flex; justify-content: space-between; align-items: center; margin: 8px 40px 0; }
  .style-meta .name { font-size: 13px; font-weight: 600; }
  .style-meta .count { font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .progress { height: 3px; margin: 7px 40px 0; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .15s; }

  /* ── BUTTONS ────────────────────────────────────── */
  .ghost-btn {
    border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-primary);
    border-radius: 8px; font-size: 11px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
  }
  .ghost-btn:hover { border-color: rgba(255,255,255,.2); }
  .ghost-btn:disabled { opacity: .4; pointer-events: none; }

  /* ── FOOTER ─────────────────────────────────────── */
  .footer { padding: 10px 18px 12px; border-top: 1px solid var(--card-border); display: flex; flex-direction: column; gap: 8px; }
  select {
    flex: 1; min-width: 0;
    background: var(--input-bg); color: var(--text-primary);
    border: 1px solid transparent; border-radius: 7px; font: inherit; font-size: 11.5px; padding: 6px;
  }
  select:focus { outline: none; border-color: var(--accent); }
  .check-row { display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 11px; color: var(--text-secondary); cursor: pointer; }
  .check-row input { accent-color: var(--accent); }
  .actions.small .ghost-btn { flex: 1; }
  .target { font-size: 10.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; }
  .primary-btn, .secondary-btn { flex: 1; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; cursor: pointer; }
  .primary-btn { border: none; background: var(--accent); color: #06142E; font-weight: 600; }
  .primary-btn:hover { filter: brightness(1.08); }
  .primary-btn:disabled { opacity: .4; pointer-events: none; }
  .secondary-btn { border: 1px solid var(--card-border); background: var(--card-bg); font-weight: 500; }
  .secondary-btn:hover { border-color: rgba(255,255,255,.2); }
  .status { min-height: 13px; font-size: 10.5px; color: var(--text-secondary); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
</style>
</head>
<body>
<div id="root"></div>
<!-- SCRIPT -->
</body>
</html>
