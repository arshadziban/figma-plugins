<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Shades Maker</title>
<style>
  html { height: 100%; }
  :root {
    --bg-main: #18181A;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.07);
    --text-primary: #FFFFFF;
    --text-secondary: #9A9A9A;
    --text-tertiary: #60605E;
    --accent: #4DE6AA;
    --accent-dark: #0D1F17;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    font-size: 13px;
    padding: 20px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    height: 100%;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
  }

  /* ── HEADER ─────────────────────────────────────── */
  .header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .logo {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    background: var(--accent-dark);
    border-radius: 9px;
    position: relative;
    overflow: hidden;
  }
  .logo-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    position: absolute;
  }
  .logo-dot-1 {
    background: var(--accent);
    top: 5px; left: 5px;
    z-index: 2;
  }
  .logo-dot-2 {
    background: #25A566;
    bottom: 5px; right: 5px;
    z-index: 1;
  }
  .header-text {
    flex: 1;
    min-width: 0;
    padding-top: 1px;
  }
  .header-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1px;
    line-height: 1.2;
  }
  .header-title span { font-weight: 400; color: var(--text-secondary); }
  .header-sub {
    margin-top: 3px;
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.45;
  }


  /* ── SELECTED COLOR CARD ─────────────────────────── */
  .color-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
  }
  .color-swatch {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    flex-shrink: 0;
    background: #026A75;
    box-shadow: 0 2px 12px rgba(0,0,0,.4), inset 0 0 0 1px rgba(0,0,0,.12);
    transition: background .2s;
  }
  .color-meta {}
  .color-label {
    font-size: 10.5px;
    color: var(--text-secondary);
    margin-bottom: 5px;
  }
  .color-hex {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
  }
  .color-status {
    font-size: 10.5px;
    color: var(--text-secondary);
  }

  /* ── PREVIEW ─────────────────────────────────────── */
  .preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .preview-title {
    font-size: 12px;
    font-weight: 600;
  }
  .preview-count {
    font-size: 10.5px;
    color: var(--text-secondary);
  }
  .preview-swatches {
    display: flex;
    gap: 6px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    justify-content: space-between;
  }
  .swatch-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    min-width: 0;
  }
  .swatch-box {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 7px;
    margin-bottom: 8px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.1);
    transition: background .2s;
  }
  .swatch-box.is-base {
    box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(255,255,255,.15), inset 0 0 0 1px rgba(0,0,0,.1);
  }
  .swatch-pct {
    font-size: 9.5px;
    font-weight: 600;
    margin-bottom: 3px;
    color: var(--text-primary);
  }
  .swatch-hex-label {
    font-size: 8.5px;
    color: var(--text-secondary);
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    width: 100%;
    text-align: center;
  }

  /* ── EMPTY STATE ─────────────────────────────────── */
  .empty-wrap {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .empty-card {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 72px;
    border-radius: 12px;
    border: 1px dashed var(--card-border);
    color: var(--text-tertiary);
    font-size: 11px;
    text-align: center;
  }
  .empty-preview {
    height: 88px;
    border-radius: 12px;
    border: 1px dashed var(--card-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-tertiary);
    font-size: 11px;
  }

  /* ── BUTTON ──────────────────────────────────────── */
  .generate-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    background: var(--accent);
    color: #021208;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.2px;
    border: none;
    cursor: pointer;
    position: relative;
    transition: filter .15s, transform .1s;
    margin-top: auto;
    flex-shrink: 0;
  }
  .generate-btn:hover:not(:disabled) { filter: brightness(1.07); }
  .generate-btn:active:not(:disabled) { transform: scale(0.985); }
  .generate-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-arrow {
    position: absolute;
    right: 16px;
    display: flex;
    align-items: center;
  }

  /* ── FOOTER ──────────────────────────────────────── */
  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 10.5px;
    color: var(--text-tertiary);
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <div class="logo-dot logo-dot-1"></div>
    <div class="logo-dot logo-dot-2"></div>
  </div>
  <div class="header-text">
    <div class="header-title">Shades <span>Maker</span></div>
    <div class="header-sub">Generate a color scale from any selected shape</div>
  </div>

</div>

<!-- POPULATED STATE -->
<div id="populatedView" style="display:none; flex-direction:column; gap:18px;">
  <!-- Selected Color Card -->
  <div class="color-card">
    <div class="color-swatch" id="bigSwatch"></div>
    <div class="color-meta">
      <div class="color-label">Selected Color</div>
      <div class="color-hex" id="bigHex">#000000</div>
      <div class="color-status">Solid fill detected</div>
    </div>
  </div>

  <!-- Preview -->
  <div>
    <div class="preview-header">
      <div class="preview-title">Preview</div>
      <div class="preview-count">5 sample shades</div>
    </div>
    <div class="preview-swatches" id="swatchRow">
      <!-- injected by JS -->
    </div>
  </div>
</div>

<!-- EMPTY STATE -->
<div id="emptyView" style="display:flex; flex-direction:column; gap:12px; flex:1;">
  <div class="empty-card" style="flex:1;">No solid fill detected</div>
  <div class="empty-preview" style="flex:1;">Select a shape to preview its scale</div>
</div>

<!-- GENERATE BUTTON -->
<button class="generate-btn" id="generateBtn" disabled>
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
  </svg>
  Generate 5% Scale Frame
  <span class="btn-arrow">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
    </svg>
  </span>
</button>

<!-- FOOTER -->
<div class="footer">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18h6"/><path d="M10 22h4"/>
    <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .34 2.27 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/>
  </svg>
  Select a rectangle with a solid fill to get started.
</div>

<script>
(function () {
  var generateBtn  = document.getElementById('generateBtn');
  var bigSwatch    = document.getElementById('bigSwatch');
  var bigHex       = document.getElementById('bigHex');
  var swatchRow    = document.getElementById('swatchRow');
  var populatedView = document.getElementById('populatedView');
  var emptyView    = document.getElementById('emptyView');

  function showPopulated(show) {
    populatedView.style.display = show ? 'flex' : 'none';
    emptyView.style.display     = show ? 'none' : 'flex';
    generateBtn.disabled        = !show;
  }

  function renderSwatches(steps) {
    var html = '';
    for (var i = 0; i < steps.length; i++) {
      var s = steps[i];
      var isBase = s.label === 'BASE';
      html += '<div class="swatch-item">'
        + '<div class="swatch-box' + (isBase ? ' is-base' : '') + '" style="background:' + s.hex + ';"></div>'
        + '<div class="swatch-pct">' + s.label + '</div>'
        + '<div class="swatch-hex-label">' + s.hex + '</div>'
        + '</div>';
    }
    swatchRow.innerHTML = html;
  }

  generateBtn.addEventListener('click', function () {
    generateBtn.disabled = true;
    generateBtn.textContent = 'Generating…';
    parent.postMessage({ pluginMessage: { type: 'generate-scale' } }, '*');
  });

  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'preview') {
      var steps = msg.steps;
      if (!steps || !steps.length) {
        showPopulated(false);
        return;
      }
      showPopulated(true);

      // Find BASE step
      var baseStep = null;
      for (var i = 0; i < steps.length; i++) {
        if (steps[i].label === 'BASE') { baseStep = steps[i]; break; }
      }
      if (baseStep) {
        bigSwatch.style.background = baseStep.hex;
        bigHex.textContent = baseStep.hex;
      }

      renderSwatches(steps);
      return;
    }

    // After generate success/error
    generateBtn.disabled = false;
    generateBtn.innerHTML =
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
      + ' Generate 5% Scale Frame '
      + '<span class="btn-arrow"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>';
  };
}());
</script>
</body>
</html>
