<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --r: 8px; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; font: 12px/1.5 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff);
    display: flex; flex-direction: column; gap: 14px; height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  header { display: flex; gap: 12px; align-items: center; }
  .logo {
    flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff);
    font-weight: 700; font-size: 13px; letter-spacing: -.02em;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  p.sub { margin: 0; color: var(--figma-color-text-secondary, #666); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span {
    padding: 2px 8px; border-radius: 999px; font-size: 11px;
    color: var(--figma-color-text-secondary, #666);
    background: var(--figma-color-bg-secondary, #f5f5f5); border: 1px solid var(--figma-color-border, #e6e6e6);
  }
  #drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border: 1.5px dashed var(--figma-color-border-strong, #bbb); border-radius: 12px;
    padding: 28px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
    color: var(--figma-color-text-secondary, #666); background: var(--figma-color-bg-secondary, transparent);
  }
  #drop:hover { border-color: var(--figma-color-border-brand, #0d99ff); }
  #drop.over { border-color: var(--figma-color-border-brand, #0d99ff); background: var(--figma-color-bg-brand-tertiary, #e5f4ff); }
  #drop svg { width: 32px; height: 32px; margin-bottom: 6px; color: var(--figma-color-icon-brand, #0d99ff); }
  #drop b { color: var(--figma-color-text, #222); font-size: 13px; font-weight: 600; }
  #drop small { font-size: 11px; opacity: .8; }
  label.opt {
    display: flex; gap: 10px; align-items: center; justify-content: space-between; cursor: pointer;
    padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--figma-color-border, #e6e6e6);
  }
  label.opt span small { display: block; color: var(--figma-color-text-secondary, #666); font-size: 11px; }
  label.opt input { appearance: none; flex: none; width: 30px; height: 18px; margin: 0; border-radius: 999px; position: relative; cursor: pointer;
    background: var(--figma-color-bg-tertiary, #ccc); transition: background .15s; }
  label.opt input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  label.opt input:checked { background: var(--figma-color-bg-brand, #0d99ff); }
  label.opt input:checked::after { transform: translateX(12px); }
  label.opt input:focus-visible { outline: 2px solid var(--figma-color-border-brand, #0d99ff); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 6px; padding: 9px 12px; cursor: pointer;
    background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff);
  }
  button.ghost { background: transparent; color: var(--figma-color-text, #222); border: 1px solid var(--figma-color-border, #ddd); }
  button.ghost:hover { background: var(--figma-color-bg-hover, rgba(128,128,128,.1)); }
  button:disabled { opacity: .45; cursor: default; }
  #file { display: none; }
  #bar { height: 4px; border-radius: 2px; background: var(--figma-color-bg-tertiary, #eee); overflow: hidden; display: none; }
  #bar i { display: block; height: 100%; width: 0; background: var(--figma-color-bg-brand, #0d99ff); transition: width .15s; }
  #status { color: var(--figma-color-text-secondary, #666); word-break: break-word; }
  #status:empty { display: none; }
  #status.err {
    color: var(--figma-color-text-danger, #f24822); padding: 8px 10px; border-radius: var(--r);
    border: 1px solid var(--figma-color-border-danger, #f24822); background: var(--figma-color-bg-danger-tertiary, transparent);
  }
  #report { overflow: auto; flex: 1; min-height: 0; }
  #report:empty { display: none; }
  #report ul { margin: 10px 0 0; padding-left: 16px; color: var(--figma-color-text-secondary, #666); }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .stats div {
    border: 1px solid var(--figma-color-border, #ddd); border-radius: var(--r); padding: 8px 4px; text-align: center;
    font-size: 10px; color: var(--figma-color-text-secondary, #666);
  }
  .stats strong { display: block; font-size: 16px; line-height: 1.3; color: var(--figma-color-text, #222); }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  footer { margin-top: auto; text-align: center; font-size: 11px; color: var(--figma-color-text-tertiary, #999); }
</style>
</head>
<body>
  <header>
    <div class="logo">Ps</div>
    <div>
      <h1>PSD2Fig</h1>
      <p class="sub">Photoshop to editable Figma layers</p>
    </div>
  </header>
  <div class="chips"><span>Live text</span><span>Vector shapes</span><span>Groups</span><span>Effects</span><span>Masks</span><span>Smart objects</span></div>
  <div id="drop" tabindex="0">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
    <b>Drop a PSD here</b>
    <small>or click to choose a file</small>
  </div>
  <input id="file" type="file" accept=".psd,image/vnd.adobe.photoshop,application/x-photoshop">
  <label class="opt"><span>Keep hidden layers<small>Imported as hidden in Figma</small></span><input type="checkbox" id="hidden" checked></label>
  <div id="bar"><i></i></div>
  <div id="status"></div>
  <div id="report"></div>
  <div class="row"><button id="cancel" class="ghost" style="display:none">Cancel</button></div>
  <footer>Files are processed locally and never uploaded</footer>
  <!-- SCRIPT -->
</body>
</html>
