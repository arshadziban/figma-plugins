<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Shades Changer</title>
<style>
  :root {
    --accent-light: #8fe3ab;
    --accent: #2fa563;
    --accent-dark: #1c6b40;
    --bg-0: #08080a;
    --hairline: rgba(255, 255, 255, 0.06);
    --text-primary: #f3f1ec;
    --text-muted: #8d897f;
    --text-faint: #55524b;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    color: var(--text-primary);
    background: radial-gradient(120% 90% at 15% -10%, #16211a 0%, var(--bg-0) 45%),
      var(--bg-0);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 20px 18px 16px;
  }

  .header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding-bottom: 16px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--hairline);
  }

  .logo-mark {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #0c2016;
    background: linear-gradient(145deg, var(--accent-light), var(--accent) 65%, var(--accent-dark));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.5),
      inset 0 -6px 10px rgba(0, 0, 0, 0.18),
      0 4px 14px rgba(47, 165, 99, 0.25);
  }

  .header-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .logo-title {
    font-size: 14.5px;
    font-weight: 650;
    letter-spacing: 0.1px;
    color: var(--text-primary);
  }

  .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.45;
  }

  .section-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: var(--text-faint);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .preview {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .preview-card {
    flex: 1;
    border: 1px solid var(--card-border, rgba(255, 255, 255, 0.07));
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0));
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .preview-empty {
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    padding: 0 12px;
    line-height: 1.5;
  }

  .swatch-stack {
    width: 100%;
    max-width: 240px;
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
  }

  .swatch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 11px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2px;
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.12);
  }

  .swatch-row.is-base {
    padding: 16px 11px;
    font-size: 10.5px;
  }

  .status {
    min-height: 15px;
    font-size: 11.5px;
    text-align: center;
    margin: 12px 0 2px;
    transition: color 0.2s ease;
  }

  .status.error {
    color: #e07a70;
  }

  .status.success {
    color: var(--accent-light);
  }

  button.primary {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    outline: none;
    cursor: pointer;
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 650;
    letter-spacing: 0.3px;
    color: #0c2016;
    background: linear-gradient(150deg, var(--accent-light), var(--accent) 65%, var(--accent-dark));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.45),
      0 8px 20px rgba(47, 165, 99, 0.22);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }

  button.primary:hover {
    filter: brightness(1.05);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.5),
      0 10px 24px rgba(47, 165, 99, 0.3);
  }

  button.primary:active {
    transform: translateY(1px) scale(0.99);
  }

  button.primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    filter: none;
    box-shadow: none;
  }

</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo-mark">S</div>
      <div class="header-text">
        <div class="logo-title">Shades Changer</div>
        <div class="subtitle">Select a colored rectangle, then generate a full 5% tint/shade scale as an Auto Layout frame.</div>
      </div>
    </div>

    <div class="preview">
      <div class="section-label">Preview</div>
      <div class="preview-card" id="previewCard">
        <div class="preview-empty" id="previewEmpty">Select a colored rectangle to preview its scale</div>
        <div class="swatch-stack" id="previewStack" style="display:none;"></div>
      </div>
    </div>

    <div class="status" id="status"></div>

    <button class="primary" id="generateBtn">Generate 5% Scale Frame</button>
  </div>

<script>
  const btn = document.getElementById('generateBtn');
  const statusEl = document.getElementById('status');
  const previewEmpty = document.getElementById('previewEmpty');
  const previewStack = document.getElementById('previewStack');

  function setStatus(message, kind) {
    statusEl.textContent = message || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function renderPreview(steps) {
    if (!steps || !steps.length) {
      previewEmpty.style.display = 'block';
      previewStack.style.display = 'none';
      previewStack.innerHTML = '';
      return;
    }

    previewEmpty.style.display = 'none';
    previewStack.style.display = 'block';
    previewStack.innerHTML = steps
      .map((step) => {
        const textHex = step.textColor.r === 0 ? '#000000' : '#ffffff';
        const rowClass = step.label === 'BASE' ? 'swatch-row is-base' : 'swatch-row';
        return (
          '<div class="' + rowClass + '" style="background:' + step.hex + '; color:' + textHex + ';">' +
          '<span>' + step.hex + '</span><span>' + step.label + '</span>' +
          '</div>'
        );
      })
      .join('');
  }

  btn.addEventListener('click', () => {
    setStatus('', '');
    btn.disabled = true;
    btn.textContent = 'Generating...';
    parent.postMessage({ pluginMessage: { type: 'generate-scale' } }, '*');
  });

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'preview') {
      renderPreview(msg.steps);
      return;
    }

    btn.disabled = false;
    btn.textContent = 'Generate 5% Scale Frame';

    if (msg.type === 'error') {
      setStatus(msg.message, 'error');
    } else if (msg.type === 'success') {
      setStatus(msg.message, 'success');
    }
  };
</script>
</body>
</html>
