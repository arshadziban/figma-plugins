<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --text: var(--figma-color-text, #1e1e1e);
    --muted: var(--figma-color-text-secondary, #6b6b6b);
    --bg: var(--figma-color-bg, #fff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --hover: var(--figma-color-bg-hover, #f0f0f0);
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --onbrand: var(--figma-color-text-onbrand, #fff);
    --danger: var(--figma-color-text-danger, #f24822);
    --success: var(--figma-color-text-success, #14ae5c);
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 12px/1.45 Inter, system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #ff7a59, #e5484d); display: grid; place-items: center; flex: none; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 11px; }

  section { padding: 0 16px; }
  .label { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 6px; }
  .label .count { text-transform: none; letter-spacing: 0; font-weight: 500; }

  .field { display: flex; align-items: center; height: 34px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); transition: border-color .15s, box-shadow .15s; }
  .field:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
  .field svg { margin: 0 0 0 10px; color: var(--muted); flex: none; }
  .field input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 13px; padding: 0 6px 0 8px; }
  .field .ext { padding: 0 12px 0 0; color: var(--muted); font-size: 13px; }

  .tools { display: flex; align-items: center; justify-content: space-between; }
  .link { border: 0; background: none; color: var(--brand); font: 600 11px Inter, system-ui, sans-serif; cursor: pointer; padding: 2px 0; text-transform: none; letter-spacing: 0; }
  .link:hover:not(:disabled) { text-decoration: underline; }
  .link:disabled { opacity: .4; cursor: default; }

  .list-wrap { flex: 1; min-height: 0; margin: 0 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg2); overflow: hidden; display: flex; flex-direction: column; }
  ul { list-style: none; margin: 0; padding: 6px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  li { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 4px; border-radius: 6px; background: var(--bg); border: 1px solid transparent; transition: opacity .15s, border-color .15s, box-shadow .15s; }
  li:hover { border-color: var(--border); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  li.off { opacity: .5; }
  li.dragging { opacity: .4; }
  li.over { border-color: var(--brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 25%, transparent); }
  .grip { color: var(--muted); opacity: .5; cursor: grab; display: grid; place-items: center; width: 14px; flex: none; }
  li:hover .grip { opacity: 1; }
  input[type=checkbox] { margin: 0; width: 14px; height: 14px; accent-color: var(--brand); flex: none; cursor: pointer; }
  .thumb { width: 44px; height: 44px; flex: none; border-radius: 5px; border: 1px solid var(--border); background: var(--bg2) center/contain no-repeat; }
  .meta { flex: 1; min-width: 0; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .size { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .arrows { display: flex; opacity: 0; transition: opacity .12s; }
  li:hover .arrows, li:focus-within .arrows { opacity: 1; }
  button.icon { width: 22px; height: 22px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  button.icon:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  button.icon:disabled { opacity: .25; cursor: default; }
  .badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); font-weight: 700; font-size: 11px; display: grid; place-items: center; font-variant-numeric: tabular-nums; flex: none; }
  li.off .badge { background: var(--hover); color: var(--muted); }

  #empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 24px; color: var(--muted); }
  #empty .ring { width: 48px; height: 48px; border-radius: 14px; background: var(--bg); border: 1px dashed var(--border); display: grid; place-items: center; margin-bottom: 4px; }
  #empty strong { color: var(--text); font-size: 13px; }

  footer { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .out { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  .out b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
  #merge { position: relative; overflow: hidden; height: 36px; border: 0; border-radius: var(--radius); background: var(--brand); color: var(--onbrand); font: 600 13px Inter, system-ui, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: filter .15s, transform .05s; }
  #merge:hover:not(:disabled) { filter: brightness(1.08); }
  #merge:active:not(:disabled) { transform: translateY(1px); }
  #merge:disabled { opacity: .45; cursor: default; }
  #merge:focus-visible, .link:focus-visible, button.icon:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  #progress { height: 3px; border-radius: 2px; background: var(--bg2); overflow: hidden; }
  #progress-bar { height: 100%; width: 0; background: var(--brand); transition: width .2s ease; }
  #status { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: var(--muted); }
  #status[data-kind=error] { color: var(--danger); }
  #status[data-kind=success] { color: var(--success); font-weight: 600; }
  #status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
</style>
</head>
<body>
  <header>
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h5l3 3v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z"/><path d="M10 2.5v3h3"/><path d="M6.5 9.5h4M6.5 12h4"/></svg>
    </div>
    <div>
      <h1>PDFMerge</h1>
      <div class="sub">Combine frames into a single PDF</div>
    </div>
  </header>

  <section>
    <div class="label"><span>File name</span></div>
    <label class="field">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.5h4.5l3 3v7a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M8 1.5v3h3"/></svg>
      <input type="text" id="filename" value="merged" placeholder="merged" spellcheck="false" autocomplete="off" aria-label="File name">
      <span class="ext">.pdf</span>
    </label>

    <div class="label tools" id="tools">
      <span>Pages <span class="count" id="count"></span></span>
      <button class="link" id="toggle-all">Deselect all</button>
    </div>
  </section>

  <div class="list-wrap">
    <ul id="list" hidden></ul>
    <div id="empty">
      <div class="ring">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="16" height="16" rx="2.5" stroke-dasharray="3 2.5"/><path d="M8 11h6M11 8v6"/></svg>
      </div>
      <strong>No frames selected</strong>
      <span>Select one or more frames on the canvas to add them as pages.</span>
    </div>
  </div>

  <footer>
    <div class="out"><span>Saves as</span><b id="preview-name">merged.pdf</b></div>
    <div id="progress" hidden><div id="progress-bar"></div></div>
    <button id="merge" disabled>
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 2v8M4 7l3.5 3.5L11 7M2.5 12.5h10"/></svg>
      <span id="merge-label">Merge to PDF</span>
    </button>
    <div id="status" hidden><span id="status-text"></span></div>
  </footer>
  <!-- SCRIPT -->
</body>
</html>
