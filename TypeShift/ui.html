<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TypeShift</title>
<style>
  /* Figma injects --figma-color-* when the UI is shown with themeColors: true,
     so the plugin follows the editor's light or dark theme. Fallbacks match the light design. */
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg-2: var(--figma-color-bg-secondary, #f7f8fa);
    --bg-hover: var(--figma-color-bg-hover, #f1f3f6);
    --text: var(--figma-color-text, #111827);
    --text-2: var(--figma-color-text-secondary, #6b7280);
    --text-3: var(--figma-color-text-tertiary, #9ca3af);
    --icon: var(--figma-color-icon-secondary, #6b7280);
    --border: var(--figma-color-border, #e5e7eb);
    --border-strong: var(--figma-color-border-strong, #cbd1d9);
    --focus: var(--figma-color-border-selected, #1a6dff);
    --brand: var(--figma-color-bg-brand, #1a6dff);
    --brand-hover: var(--figma-color-bg-brand-hover, #0f5bdb);
    --brand-soft: color-mix(in srgb, var(--brand) 14%, transparent);
    --on-brand: var(--figma-color-text-onbrand, #ffffff);
    --danger: var(--figma-color-text-danger, #dc3412);
    --warning: var(--figma-color-text-warning, #b86200);
    --success: var(--figma-color-text-success, #14ae5c);
    --shadow: 0 8px 24px rgba(17,24,39,0.14), 0 0 0 1px rgba(17,24,39,0.06);
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    line-height: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  svg { display: block; flex-shrink: 0; }

  /* ── HEADER ─────────────────────────────────────── */
  .header { flex-shrink: 0; padding: 14px 16px 10px; }
  .header-row { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: var(--on-brand);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; letter-spacing: -0.02em;
  }
  .title { flex: 1; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle { margin-top: 8px; font-size: 12px; line-height: 18px; color: var(--text-2); }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent;
    color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-hover); }

  /* ── MAIN SCROLL AREA ───────────────────────────── */
  .main {
    flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 4px 12px 12px;
    display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
  }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .card { min-width: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-2); flex-shrink: 0; }
  .card.styles { background: var(--bg); }
  .card-pad { padding: 12px; }
  .label-row { display: flex; align-items: center; justify-content: space-between; height: 20px; margin-bottom: 8px; }
  .label { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .link-btn {
    border: none; background: transparent; color: var(--text-2); font-size: 12px; cursor: pointer; padding: 0 2px;
  }
  .link-btn:hover { color: var(--text); }
  .link-btn[hidden] { display: none; }
  .link-btn.brand { color: var(--brand); font-weight: 500; }
  .link-btn.brand:hover { color: var(--brand-hover); }
  .help { color: var(--text-3); cursor: help; }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .grid > * { min-width: 0; }

  /* ── INPUTS ─────────────────────────────────────── */
  .input {
    position: relative; display: flex; align-items: center;
    height: 36px; border-radius: 9px;
    background: var(--bg); border: 1px solid var(--border);
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  .input:hover { border-color: var(--border-strong); }
  .input:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px var(--brand-soft); }
  .input.invalid { border-color: var(--danger); }
  .input.disabled { opacity: 0.55; }
  .input .lead { margin-left: 10px; color: var(--icon); }
  .input input, .input select {
    flex: 1; min-width: 0; width: 100%; height: 100%; text-overflow: ellipsis;
    background: transparent; border: none; outline: none;
    color: var(--text); font: inherit; font-size: 12.5px;
    padding: 0 10px;
  }
  .input input::placeholder { color: var(--text-3); }
  .input select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 30px; }
  .input select:disabled { cursor: default; }
  .input select option { background: var(--bg); color: var(--text); }
  .input .trail { position: absolute; right: 10px; color: var(--icon); pointer-events: none; }
  .hint { font-size: 11px; color: var(--danger); margin-top: 4px; display: none; }
  .invalid + .hint { display: block; }

  /* ── FONT PICKER ────────────────────────────────── */
  .combo { position: relative; }
  .popover {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    max-height: 232px; overflow-y: auto;
    background: var(--bg); border-radius: 10px; box-shadow: var(--shadow);
    padding: 4px; display: none;
  }
  .combo.open .popover { display: block; }
  .option {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 30px; padding: 0 10px; border-radius: 7px; cursor: default;
  }
  .option.active { background: var(--brand); color: var(--on-brand); }
  .option.active .option-meta { color: var(--on-brand); opacity: 0.8; }
  .option-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .option-name mark { background: none; color: inherit; font-weight: 600; }
  .option-meta { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
  .popover-empty { padding: 10px; color: var(--text-3); }

  .chosen {
    margin-top: 10px; width: 100%; text-align: left;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); cursor: pointer;
  }
  .chosen:hover { border-color: var(--border-strong); }
  .chosen[hidden] { display: none; }
  .chosen-text { flex: 1; min-width: 0; }
  .chosen-name { font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chosen-meta { font-size: 12px; color: var(--text-2); }
  .chev { color: var(--icon); }

  /* ── STYLE LIST ─────────────────────────────────── */
  .styles-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 10px; }
  .styles-count { font-size: 12px; color: var(--text-2); }
  .styles-tools { padding: 0 12px; }
  .chips { display: flex; gap: 6px; padding: 10px 12px 12px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; max-width: 150px; height: 28px; padding: 0 10px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer;
  }
  .chip:hover { background: var(--bg-hover); }
  .chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .chip-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip-count {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px;
    background: var(--bg-hover); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center;
  }
  .chip.on .chip-count { background: rgba(255,255,255,0.25); color: var(--on-brand); }

  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; cursor: pointer; user-select: none;
    border-top: 1px solid var(--border);
  }
  .item:hover { background: var(--bg-hover); }
  .item:last-child { border-radius: 0 0 11px 11px; }
  .item-text { flex: 1; min-width: 0; }
  .item-name { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 600; }
  .item-name span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-size { text-align: left; font-size: 12px; color: var(--text-2); white-space: nowrap; min-width: 74px; }

  .badge {
    flex-shrink: 0; display: inline-flex; align-items: center;
    height: 18px; padding: 0 6px; border-radius: 5px; font-size: 10.5px; font-weight: 500;
  }
  .badge.success { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
  .badge.warn { color: var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); }
  .badge.error { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  /* ── CHECKBOX ───────────────────────────────────── */
  .check {
    appearance: none; -webkit-appearance: none; flex-shrink: 0;
    width: 20px; height: 20px; margin: 0; border-radius: 6px;
    border: 1.5px solid var(--border-strong); background: var(--bg);
    display: grid; place-content: center; cursor: pointer;
  }
  .check::after {
    content: ""; width: 10px; height: 6px; display: none;
    border-left: 2px solid var(--on-brand); border-bottom: 2px solid var(--on-brand);
    transform: translateY(-1px) rotate(-45deg);
  }
  .check:checked { background: var(--brand); border-color: var(--brand); }
  .check:checked::after { display: block; }
  .check:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ── EMPTY STATES ───────────────────────────────── */
  .empty { padding: 32px 24px; text-align: center; color: var(--text-3); border-top: 1px solid var(--border); }
  .empty-title { color: var(--text-2); font-weight: 500; margin-bottom: 4px; }

  /* ── FOOTER ─────────────────────────────────────── */
  .footer {
    flex-shrink: 0; padding: 10px 16px 14px; border-top: 1px solid var(--border); background: var(--bg);
  }
  .footer-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .selected-info { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 12.5px; }
  .btn {
    width: 100%; height: 44px; border-radius: 10px; border: none;
    background: var(--brand); color: var(--on-brand); font-size: 14px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--brand-hover); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; display: none;
    border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.7s linear infinite;
  }
  .btn.loading .spinner { display: block; }
  .btn.loading .play { display: none; }

  /* ── TOAST ──────────────────────────────────────── */
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: 120px; z-index: 30;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 12px; border-radius: 10px;
    background: #1e1e1e; color: #ffffff; box-shadow: var(--shadow);
    font-size: 11.5px; line-height: 16px;
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
  }
  .toast.show { opacity: 1; transform: none; pointer-events: auto; }
  .toast-icon { margin-top: 1px; }
  .toast.success .toast-icon { color: #14ae5c; }
  .toast.error .toast-icon { color: #f24822; }
  .toast-text { flex: 1; }
  .toast .icon-btn { width: 18px; height: 18px; border-radius: 4px; color: rgba(255,255,255,0.6); margin: -1px -4px 0 0; }
  .toast .icon-btn:hover { background: rgba(255,255,255,0.1); color: #ffffff; }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <!-- ── HEADER ───────────────────────────────────── -->
  <div class="header">
    <div class="header-row">
      <div class="logo">Tt</div>
      <div class="title">Update Text Styles</div>
      <button class="icon-btn" id="close" title="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
      </button>
    </div>
    <div class="subtitle">Update multiple text styles at once. Choose a new font, weight, line height and letter spacing.</div>
  </div>

  <div class="main">

    <!-- ── CHANGES ──────────────────────────────────── -->
    <div class="card card-pad">
      <div class="label-row">
        <div class="label">Font Family</div>
        <button class="link-btn" id="reset" title="Clear all fields" hidden>Clear</button>
      </div>

      <div class="combo" id="combo">
        <div class="input" id="family-box">
          <svg class="lead" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6L14 14"/></svg>
          <input type="text" id="family" placeholder="Search fonts..." autocomplete="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="font-options" aria-autocomplete="list" />
          <svg class="trail" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>
        </div>
        <div class="popover" id="font-options" role="listbox"></div>
      </div>

      <button class="chosen" id="chosen" hidden>
        <div class="chosen-text">
          <div class="chosen-name" id="chosen-name"></div>
          <div class="chosen-meta" id="chosen-meta"></div>
        </div>
        <svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5L9.5 7 5 11.5"/></svg>
      </button>

      <div class="divider"></div>

      <div class="label-row"><div class="label">Font Weight</div></div>
      <div class="input" id="weight-box">
        <select id="weight" disabled>
          <option value="">Keep original (match weight)</option>
        </select>
        <svg class="trail" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>
      </div>

      <div class="grid" style="margin-top: 14px;">
        <div>
          <div class="label-row">
            <div class="label">Line Height
              <svg class="help" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><title>Pixels (24), percent (150%) or auto</title><circle cx="7" cy="7" r="5.8"/><path d="M5.4 5.4a1.7 1.7 0 1 1 2.4 1.55c-.5.25-.8.6-.8 1.1M7 9.9v.1"/></svg>
            </div>
          </div>
          <div class="input" id="line-height-box">
            <input type="text" id="line-height" placeholder="e.g. 24, 150% or auto" autocomplete="off" spellcheck="false" />
          </div>
          <div class="hint">Use 24, 24px, 150% or auto.</div>
        </div>
        <div>
          <div class="label-row">
            <div class="label">Letter Spacing
              <svg class="help" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><title>Percent (-2%) or pixels (0.5px)</title><circle cx="7" cy="7" r="5.8"/><path d="M5.4 5.4a1.7 1.7 0 1 1 2.4 1.55c-.5.25-.8.6-.8 1.1M7 9.9v.1"/></svg>
            </div>
          </div>
          <div class="input" id="letter-spacing-box">
            <input type="text" id="letter-spacing" placeholder="e.g. -2 or 0.5px" autocomplete="off" spellcheck="false" />
          </div>
          <div class="hint">Use -2, -2% or 0.5px.</div>
        </div>
      </div>
    </div>

    <!-- ── TEXT STYLES ──────────────────────────────── -->
    <div class="card styles">
      <div class="styles-head">
        <div class="label">Text Styles</div>
        <div class="styles-count" id="style-count"></div>
      </div>

      <div class="styles-tools">
        <div class="input">
          <svg class="lead" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6L14 14"/></svg>
          <input type="text" id="search" placeholder="Search styles..." autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <div class="chips" id="chips"></div>

      <div id="list">
        <div class="empty">Loading text styles…</div>
      </div>
    </div>
  </div>

  <!-- ── FOOTER ───────────────────────────────────── -->
  <div class="footer">
    <div class="footer-row">
      <div class="selected-info">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2H4.5A1.5 1.5 0 0 0 3 3.5v9A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V5.5L9.5 2z"/><path d="M9.5 2v3.5H13"/></svg>
        <span id="selected-label">0 styles selected</span>
      </div>
      <button class="link-btn brand" id="select-all">Select all</button>
    </div>
    <button class="btn" id="apply" disabled>
      <span class="spinner"></span>
      <svg class="play" width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.8v10.4a.6.6 0 0 0 .9.5l8.4-5.2a.6.6 0 0 0 0-1L3.9 1.3a.6.6 0 0 0-.9.5z"/></svg>
      <span id="apply-label">Apply Changes</span>
    </button>
  </div>

  <div class="toast" id="toast" role="status">
    <svg class="toast-icon" id="toast-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></svg>
    <div class="toast-text" id="toast-text"></div>
    <button class="icon-btn" id="toast-close" title="Dismiss">
      <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
    </button>
  </div>

<script>
  var families = [];
  var familyByLower = {};
  var stylesByFamily = {};
  var textStyles = [];
  var selected = {};
  var notes = {};
  var applying = false;
  var chosenFamily = "";
  var filter = ""; // "" = all, "__selected" = ticked styles, otherwise a font family

  var familyInput = document.getElementById("family");
  var combo = document.getElementById("combo");
  var fontOptions = document.getElementById("font-options");
  var chosenCard = document.getElementById("chosen");
  var chosenName = document.getElementById("chosen-name");
  var chosenMeta = document.getElementById("chosen-meta");
  var weightSelect = document.getElementById("weight");
  var weightBox = document.getElementById("weight-box");
  var lineHeightInput = document.getElementById("line-height");
  var lineHeightBox = document.getElementById("line-height-box");
  var letterSpacingInput = document.getElementById("letter-spacing");
  var letterSpacingBox = document.getElementById("letter-spacing-box");
  var searchInput = document.getElementById("search");
  var chipsEl = document.getElementById("chips");
  var selectAllBtn = document.getElementById("select-all");
  var selectedLabel = document.getElementById("selected-label");
  var styleCount = document.getElementById("style-count");
  var listEl = document.getElementById("list");
  var applyBtn = document.getElementById("apply");
  var applyLabel = document.getElementById("apply-label");
  var toast = document.getElementById("toast");
  var toastIcon = document.getElementById("toast-icon");
  var toastText = document.getElementById("toast-text");

  function post(msg) { parent.postMessage({ pluginMessage: msg }, "*"); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  document.getElementById("close").addEventListener("click", function () { post({ type: "close" }); });

  // ── Toast ────────────────────────────────────────

  var toastTimer = null;
  var TOAST_ICONS = {
    success: '<circle cx="7" cy="7" r="5.8"/><path d="M4.6 7.1l1.7 1.7 3.1-3.3"/>',
    error: '<circle cx="7" cy="7" r="5.8"/><path d="M7 4.2v3.4M7 9.7v.1"/>',
  };

  function showToast(text, kind) {
    clearTimeout(toastTimer);
    toast.className = "toast show " + kind;
    toastIcon.innerHTML = TOAST_ICONS[kind];
    toastText.textContent = text;
    if (kind === "success") toastTimer = setTimeout(hideToast, 4000);
  }

  function hideToast() { toast.classList.remove("show"); }

  document.getElementById("toast-close").addEventListener("click", hideToast);

  // ── Parsing ──────────────────────────────────────

  function targetFamily() { return chosenFamily || null; }

  // "" → keep, "auto" → AUTO, "150%" → PERCENT, "24" or "24px" → PIXELS. Returns undefined if invalid.
  function parseLineHeight(raw) {
    var s = raw.trim().toLowerCase();
    if (!s) return null;
    if (s === "auto") return { unit: "AUTO" };
    var m = s.match(/^(\d*\.?\d+)\s*(px|%)?$/);
    if (!m) return undefined;
    return { value: parseFloat(m[1]), unit: m[2] === "%" ? "PERCENT" : "PIXELS" };
  }

  // "" → keep, "0.5px" → PIXELS, "-2" or "-2%" → PERCENT (Figma's default unit). Returns undefined if invalid.
  function parseLetterSpacing(raw) {
    var s = raw.trim().toLowerCase();
    if (!s) return null;
    var m = s.match(/^(-?\d*\.?\d+)\s*(px|%)?$/);
    if (!m) return undefined;
    return { value: parseFloat(m[1]), unit: m[2] === "px" ? "PIXELS" : "PERCENT" };
  }

  // Returns the changes requested in the form, or null if a field is invalid.
  function pendingChanges() {
    var family = targetFamily();
    var lineHeight = parseLineHeight(lineHeightInput.value);
    var letterSpacing = parseLetterSpacing(letterSpacingInput.value);
    lineHeightBox.classList.toggle("invalid", lineHeight === undefined);
    letterSpacingBox.classList.toggle("invalid", letterSpacing === undefined);
    if (lineHeight === undefined || letterSpacing === undefined) return null;
    return {
      family: family,
      style: family ? weightSelect.value : "",
      lineHeight: lineHeight,
      letterSpacing: letterSpacing,
    };
  }

  // ── Font picker ──────────────────────────────────

  var matches = [];
  var activeIndex = -1;
  var MAX_OPTIONS = 150;

  function openFonts() {
    combo.classList.add("open");
    familyInput.setAttribute("aria-expanded", "true");
    renderFontOptions();
  }

  function closeFonts() {
    combo.classList.remove("open");
    familyInput.setAttribute("aria-expanded", "false");
    activeIndex = -1;
  }

  function renderFontOptions() {
    var q = familyInput.value.trim().toLowerCase();
    if (!q) {
      matches = families.slice(0, MAX_OPTIONS);
    } else {
      var starts = [];
      var contains = [];
      for (var i = 0; i < families.length; i++) {
        var idx = families[i].toLowerCase().indexOf(q);
        if (idx === 0) starts.push(families[i]);
        else if (idx > 0) contains.push(families[i]);
      }
      matches = starts.concat(contains).slice(0, MAX_OPTIONS);
    }
    if (activeIndex >= matches.length) activeIndex = matches.length - 1;
    if (activeIndex < 0 && q && matches.length) activeIndex = 0;

    if (!families.length) {
      fontOptions.innerHTML = '<div class="popover-empty">Loading fonts…</div>';
      return;
    }
    if (!matches.length) {
      fontOptions.innerHTML = '<div class="popover-empty">No fonts match “' + escapeHtml(familyInput.value.trim()) + '”</div>';
      return;
    }

    fontOptions.innerHTML = matches.map(function (f, i) {
      var name = escapeHtml(f);
      var at = q ? f.toLowerCase().indexOf(q) : -1;
      if (at !== -1) {
        name = escapeHtml(f.slice(0, at)) + "<mark>" + escapeHtml(f.slice(at, at + q.length)) + "</mark>" + escapeHtml(f.slice(at + q.length));
      }
      var n = stylesByFamily[f].length;
      return '<div class="option' + (i === activeIndex ? " active" : "") + '" role="option" data-index="' + i + '">' +
        '<span class="option-name">' + name + "</span>" +
        '<span class="option-meta">' + plural(n, "style") + "</span>" +
      "</div>";
    }).join("");
    scrollActiveIntoView();
  }

  function scrollActiveIntoView() {
    var el = fontOptions.querySelector(".option.active");
    if (el) el.scrollIntoView({ block: "nearest" });
  }

  function setActive(index) {
    activeIndex = index;
    var options = fontOptions.querySelectorAll(".option");
    for (var i = 0; i < options.length; i++) options[i].classList.toggle("active", i === index);
    scrollActiveIntoView();
  }

  function chooseFamily(family) {
    chosenFamily = family || "";
    familyInput.value = "";
    closeFonts();
    familyInput.blur();
    onFamilyChanged();
  }

  function onFamilyChanged() {
    renderChosen();
    renderWeights();
    updateControls();
  }

  function renderChosen() {
    var family = targetFamily();
    chosenCard.hidden = !family;
    if (!family) return;
    chosenName.textContent = family;
    chosenName.style.fontFamily = '"' + family.replace(/"/g, "") + '", "Inter", sans-serif';
    chosenMeta.textContent = plural((stylesByFamily[family] || []).length, "style");
  }

  familyInput.addEventListener("focus", openFonts);

  familyInput.addEventListener("input", function () {
    activeIndex = -1;
    openFonts();
  });

  familyInput.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!combo.classList.contains("open")) { openFonts(); return; }
      if (!matches.length) return;
      var next = activeIndex + (e.key === "ArrowDown" ? 1 : -1);
      setActive(Math.max(0, Math.min(matches.length - 1, next)));
    } else if (e.key === "Enter") {
      if (combo.classList.contains("open") && activeIndex >= 0 && matches[activeIndex]) {
        e.preventDefault();
        chooseFamily(matches[activeIndex]);
      }
    } else if (e.key === "Escape") {
      if (combo.classList.contains("open")) {
        e.stopPropagation();
        closeFonts();
      }
    }
  });

  familyInput.addEventListener("blur", function () {
    var exact = familyByLower[familyInput.value.trim().toLowerCase()];
    if (exact) chosenFamily = exact;
    familyInput.value = "";
    closeFonts();
    onFamilyChanged();
  });

  // mousedown keeps focus in the input so blur does not close the list before the click lands.
  fontOptions.addEventListener("mousedown", function (e) { e.preventDefault(); });
  fontOptions.addEventListener("click", function (e) {
    var option = e.target.closest(".option");
    if (option) chooseFamily(matches[Number(option.getAttribute("data-index"))]);
  });
  fontOptions.addEventListener("mousemove", function (e) {
    var option = e.target.closest(".option");
    if (option) {
      var i = Number(option.getAttribute("data-index"));
      if (i !== activeIndex) setActive(i);
    }
  });

  chosenCard.addEventListener("click", function () { familyInput.focus(); });

  // ── Weight ───────────────────────────────────────

  var WEIGHT_KEYWORDS = [
    ["extrablack", 950], ["ultrablack", 950], ["black", 900], ["heavy", 900],
    ["extrabold", 800], ["ultrabold", 800], ["semibold", 600], ["demibold", 600], ["demi", 600],
    ["bold", 700], ["medium", 500], ["regular", 400], ["normal", 400], ["book", 400], ["roman", 400],
    ["extralight", 200], ["ultralight", 200], ["light", 300], ["thin", 100], ["hairline", 100],
  ];

  function cssWeight(style) {
    var s = String(style || "").toLowerCase().replace(/[\s_-]/g, "");
    for (var i = 0; i < WEIGHT_KEYWORDS.length; i++) {
      if (s.indexOf(WEIGHT_KEYWORDS[i][0]) !== -1) return Math.min(900, WEIGHT_KEYWORDS[i][1]);
    }
    return 400;
  }

  function renderWeights() {
    var family = targetFamily();
    var current = weightSelect.value;
    var styles = family ? stylesByFamily[family].slice().sort(function (a, b) {
      return cssWeight(a) - cssWeight(b) || (/italic|oblique/i.test(a) ? 1 : 0) - (/italic|oblique/i.test(b) ? 1 : 0);
    }) : [];
    weightSelect.innerHTML = '<option value="">Keep original (match weight)</option>' + styles.map(function (st) {
      return '<option value="' + escapeHtml(st) + '">' + escapeHtml(st) + "</option>";
    }).join("");
    weightSelect.value = styles.indexOf(current) !== -1 ? current : "";
    weightSelect.disabled = !family;
    weightBox.classList.toggle("disabled", !family);
  }

  weightSelect.addEventListener("change", updateControls);
  lineHeightInput.addEventListener("input", updateControls);
  letterSpacingInput.addEventListener("input", updateControls);

  document.getElementById("reset").addEventListener("click", function () {
    chosenFamily = "";
    familyInput.value = "";
    lineHeightInput.value = "";
    letterSpacingInput.value = "";
    onFamilyChanged();
  });

  // ── Style list ───────────────────────────────────

  function visibleStyles() {
    var q = searchInput.value.trim().toLowerCase();
    return textStyles.filter(function (s) {
      var matchesFilter = !filter || (filter === "__selected" ? selected[s.id] : s.family === filter);
      return matchesFilter && (!q || s.name.toLowerCase().indexOf(q) !== -1);
    });
  }

  function selectedIds() {
    return textStyles.filter(function (s) { return selected[s.id]; }).map(function (s) { return s.id; });
  }

  // Chips: All, Selected, then the three most used fonts among the styles.
  function renderChips() {
    var counts = {};
    var selectedCount = 0;
    textStyles.forEach(function (s) {
      counts[s.family] = (counts[s.family] || 0) + 1;
      if (selected[s.id]) selectedCount++;
    });
    var top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || (a < b ? -1 : 1); }).slice(0, 3);
    if (filter && filter !== "__selected" && top.indexOf(filter) === -1 && counts[filter]) top.push(filter);
    if (filter && filter !== "__selected" && !counts[filter]) filter = "";

    var chips = [{ key: "", label: "All", count: textStyles.length }, { key: "__selected", label: "Selected", count: selectedCount }]
      .concat(top.map(function (f) { return { key: f, label: f, count: counts[f] }; }));

    chipsEl.innerHTML = chips.map(function (c) {
      return '<button class="chip' + (c.key === filter ? " on" : "") + '" data-filter="' + escapeHtml(c.key) + '" title="' + escapeHtml(c.label) + '">' +
        '<span class="chip-label">' + escapeHtml(c.label) + "</span>" +
        '<span class="chip-count">' + c.count + "</span></button>";
    }).join("");
  }

  chipsEl.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    filter = chip.getAttribute("data-filter");
    renderList();
  });

  function badgeHtml(note) {
    if (!note) return "";
    return '<span class="badge ' + note.kind + '" title="' + escapeHtml(note.title || "") + '">' + escapeHtml(note.text) + "</span>";
  }

  function itemHtml(s) {
    return '<label class="item" title="' + escapeHtml(s.name) + '">' +
      '<input type="checkbox" class="check" data-id="' + escapeHtml(s.id) + '"' + (selected[s.id] ? " checked" : "") + " />" +
      '<div class="item-text">' +
        '<div class="item-name"><span>' + escapeHtml(s.name) + "</span>" + badgeHtml(notes[s.id]) + "</div>" +
        '<div class="item-meta">' + escapeHtml(s.family + " · " + s.style) + "</div>" +
      "</div>" +
      '<div class="item-size"><div>' + escapeHtml(s.size) + ' px</div><div>' + escapeHtml(s.lineHeight + " · " + s.letterSpacing) + "</div></div>" +
      '<svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5L9.5 7 5 11.5"/></svg>' +
    "</label>";
  }

  function renderList() {
    styleCount.textContent = textStyles.length ? plural(textStyles.length, "style") : "";
    renderChips();

    if (!textStyles.length) {
      listEl.innerHTML =
        '<div class="empty"><div class="empty-title">No local text styles</div>' +
        "Create text styles in the Design panel. They will appear here automatically.</div>";
      updateControls();
      return;
    }

    var visible = visibleStyles();
    if (!visible.length) {
      listEl.innerHTML = '<div class="empty"><div class="empty-title">No matching styles</div>Try a different search or filter.</div>';
      updateControls();
      return;
    }

    listEl.innerHTML = visible.map(itemHtml).join("");
    updateControls();
  }

  listEl.addEventListener("change", function (e) {
    var id = e.target.getAttribute("data-id");
    if (!id) return;
    selected[id] = e.target.checked;
    // The Selected chip hides unticked styles, so leave them in place until the list is next rendered.
    renderChips();
    updateControls();
  });

  selectAllBtn.addEventListener("click", function () {
    var visible = visibleStyles();
    var allOn = visible.length && visible.every(function (s) { return selected[s.id]; });
    visible.forEach(function (s) { selected[s.id] = !allOn; });
    renderList();
  });

  searchInput.addEventListener("input", renderList);

  // ── Footer ───────────────────────────────────────

  function updateControls() {
    var changes = pendingChanges();
    var count = selectedIds().length;
    document.getElementById("reset").hidden = !(chosenFamily || lineHeightInput.value || letterSpacingInput.value);
    var hasChange = !!changes && !!(changes.family || changes.lineHeight || changes.letterSpacing);
    applyBtn.disabled = applying || !hasChange || !count;
    applyLabel.textContent = applying ? "Applying…" : "Apply Changes";
    selectedLabel.textContent = plural(count, "style") + " selected";

    var visible = visibleStyles();
    var allOn = visible.length && visible.every(function (s) { return selected[s.id]; });
    selectAllBtn.textContent = allOn ? "Deselect all" : "Select all";
    selectAllBtn.disabled = !visible.length;
  }

  function apply() {
    var changes = pendingChanges();
    var ids = selectedIds();
    if (applying || !changes || !ids.length || !(changes.family || changes.lineHeight || changes.letterSpacing)) return;
    applying = true;
    applyBtn.classList.add("loading");
    hideToast();
    updateControls();
    post({ type: "apply", styleIds: ids, options: changes });
  }

  function finishApply() {
    applying = false;
    applyBtn.classList.remove("loading");
    updateControls();
  }

  applyBtn.addEventListener("click", apply);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) apply();
  });

  // ── Messages ─────────────────────────────────────

  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;

    switch (msg.type) {
      case "fonts-list":
        families = msg.families;
        stylesByFamily = msg.stylesByFamily;
        familyByLower = {};
        families.forEach(function (f) { familyByLower[f.toLowerCase()] = f; });
        familyInput.placeholder = "Search fonts... (" + families.length + " available)";
        if (combo.classList.contains("open")) renderFontOptions();
        onFamilyChanged();
        break;

      case "text-styles": {
        textStyles = msg.styles;
        var ids = {};
        textStyles.forEach(function (s) { ids[s.id] = true; });
        Object.keys(selected).forEach(function (id) { if (!ids[id]) delete selected[id]; });
        Object.keys(notes).forEach(function (id) { if (!ids[id]) delete notes[id]; });
        renderList();
        break;
      }

      case "apply-complete": {
        notes = {};
        var fallbacks = 0;
        var failed = 0;
        msg.results.forEach(function (r) {
          if (!r.ok) {
            failed++;
            notes[r.id] = { kind: "error", text: "Failed", title: r.error };
          } else if (r.fallback) {
            fallbacks++;
            notes[r.id] = { kind: "warn", text: "→ " + r.to, title: "No \"" + r.from + "\" in this font. Used \"" + r.to + "\"." };
          } else {
            notes[r.id] = { kind: "success", text: "Updated" };
          }
        });
        var text = "Updated " + plural(msg.updated, "style") + ".";
        if (fallbacks) text += " " + fallbacks + " used the nearest weight.";
        if (failed) text += " " + failed + " failed. Hover the badge for details.";
        showToast(text, failed ? "error" : "success");
        finishApply();
        renderList();
        break;
      }

      case "apply-error":
        showToast(msg.error, "error");
        finishApply();
        break;
    }
  };

  updateControls();
  post({ type: "init" });
</script>
</body>
</html>
